<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Page</title>
</head>
<body>
    <p>Iterating an instance of the rectangle class produces the following result:</p>
    <!-- Example of an If Statement -->
    {% if items %}
        <!-- Example of a For Loop -->
        {% for item in items %}
            <p>{{ item }}</p>
        {% endfor %}
    {% else %}
        <p>No items found in the database.</p>
    {% endif %}

</body>
</html>
